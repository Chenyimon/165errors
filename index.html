<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SORT/ED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#EDEAE0;
    --surface:#FDFCF7;
    --surface-alt:#F5F2E9;
    --forest:#2C4736;
    --forest-deep:#20362A;
    --sage:#C6D3BA;
    --sage-deep:#5C7359;
    --track:#E4E1D2;
    --sun:#E7A94C;
    --sun-deep:#C98A32;
    --terracotta:#BE5B33;
    --water:#5B7C87;
    --water-bg:#D8E4E7;
    --ink:#20281F;
    --ink-dim:#75806E;
    --border:#E4E0D0;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
    background:var(--surface);
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:21px;
    letter-spacing:0.2px;
    color:var(--forest);
  }
  .wordmark span{color:var(--terracotta);}
  .header-stats{display:flex; gap:10px; align-items:center;}
  .stat-pill{
    display:flex; align-items:center; gap:5px;
    font-size:13px; font-weight:700;
    color:var(--forest);
    background:var(--sage);
    border-radius:20px;
    padding:6px 11px;
  }
  .stat-pill .icon{font-size:13px;}

  /* ---------- Views ---------- */
  main{flex:1; padding:20px 18px 100px; position:relative;}
  .view{display:none; animation:fadeIn .25s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  h1.view-title{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--ink-dim);
    margin:0 0 18px;
  }

  /* ---------- Scan view ---------- */
  .scan-hero{
    display:flex; flex-direction:column; align-items:center;
    padding:30px 10px 10px;
    text-align:center;
  }
  .scan-btn{
    width:180px; height:180px;
    border-radius:50%;
    border:none;
    background:var(--forest);
    box-shadow:0 0 0 10px var(--sage);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .scan-btn:active{transform:scale(0.96); background:var(--forest-deep);}
  .scan-btn svg{width:44px; height:44px;}
  .scan-btn .label{
    font-family:'Inter',sans-serif;
    font-size:13px; letter-spacing:1px; text-transform:uppercase; font-weight:700;
    color:#fff;
  }
  .scan-sub{color:var(--ink-dim); font-size:13px; margin-top:22px; max-width:260px; line-height:1.5;}

  .analyzing{
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding:50px 10px;
  }
  .analyzing img{
    width:140px; height:140px; object-fit:cover; border-radius:var(--radius);
    border:1px solid var(--border); filter:saturate(0.75);
  }
  .spinner{
    width:26px; height:26px;
    border:3px solid var(--track);
    border-top-color:var(--forest);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .analyzing .msg{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--ink-dim); letter-spacing:0.5px;}

  /* ---------- Post preview (before posting) ---------- */
  .post-preview{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden;
  }
  .post-preview-image{width:100%; aspect-ratio:1/1; background:var(--surface-alt);}
  .post-preview-image img{width:100%; height:100%; object-fit:cover; display:block;}
  .post-preview-body{padding:18px;}

  /* ---------- Feed post cards ---------- */
  .post-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; margin-bottom:16px;
  }
  .post-header{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .post-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--forest); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
  }
  .post-who{flex:1; min-width:0;}
  .post-name{font-weight:700; font-size:13.5px; color:var(--ink);}
  .post-time{font-size:11px; color:var(--ink-dim); margin-top:1px;}
  .post-image{width:100%; aspect-ratio:1/1; background:var(--surface-alt); overflow:hidden;}
  .post-image img{width:100%; height:100%; object-fit:cover; display:block;}
  .post-body{padding:14px;}
  .post-item{font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--ink); margin-bottom:6px;}
  .post-fact{font-size:12.5px; color:var(--ink-dim); line-height:1.5; margin-bottom:12px;}
  .post-stats{display:flex; gap:8px; padding-top:12px; border-top:1px dashed var(--border);}
  .post-stat{flex:1; text-align:center;}
  .post-stat .num{display:block; font-weight:800; font-size:15px; color:var(--ink);}
  .post-stat .num.accent{color:var(--terracotta);}
  .post-stat .lbl{font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-dim); margin-top:2px;}

  /* ---------- Preview content (category pill, stats row, fun fact) ---------- */
  .ticket-cat{
    display:inline-block;
    font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase;
    border-radius:20px;
    padding:4px 12px;
    margin-bottom:10px;
  }
  .ticket-item{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px; line-height:1.3;
    color:var(--ink);
    margin-bottom:14px;
  }
  .ticket-stats{
    display:flex;
    gap:8px;
    padding-bottom:14px;
  }
  .ticket-stat{flex:1; text-align:center;}
  .ticket-stat .num{
    font-family:'Inter',sans-serif;
    font-size:19px; font-weight:800; color:var(--ink);
  }
  .ticket-stat .num.accent{color:var(--terracotta);}
  .ticket-stat .lbl{
    font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-dim); margin-top:2px;
  }
  .ticket-fact{
    background:var(--surface-alt);
    padding:12px 14px;
    border-radius:var(--radius-sm);
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.5;
  }
  .ticket-fact b{color:var(--ink);}
  .reveal-actions{display:flex; gap:10px; margin-top:18px;}

  /* ---------- Buttons ---------- */
  .btn{
    flex:1;
    padding:13px;
    border-radius:14px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    text-align:center;
  }
  .btn.primary{background:var(--forest); border-color:var(--forest); color:#fff;}
  .btn:active{opacity:0.8;}

  /* ---------- Empty states ---------- */
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-dim);
  }
  .empty-state .big{font-size:34px; margin-bottom:10px;}
  .empty-state p{font-size:13px; line-height:1.6;}

  /* ---------- Leaderboard ---------- */
  .lb-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px;
    border-radius:var(--radius-sm);
    margin-bottom:8px;
    background:var(--surface);
    border:1px solid var(--border);
  }
  .lb-row.me{border-color:var(--forest); background:var(--sage);}
  .lb-rank{
    font-weight:800; font-size:13px;
    color:var(--ink-dim); width:22px;
  }
  .lb-name{flex:1; font-size:14px; font-weight:700; color:var(--ink);}
  .lb-pts{font-weight:800; color:var(--terracotta); font-size:14px;}

  .name-setup{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; text-align:center;
  }
  .name-setup p{font-size:13px; color:var(--ink-dim); margin-bottom:14px; line-height:1.5;}
  .name-setup input{
    width:100%; padding:12px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    background:var(--surface-alt); color:var(--ink); font-size:14px; margin-bottom:12px;
    font-family:'Inter',sans-serif;
  }
  .name-setup input:focus{outline:none; border-color:var(--forest);}

  /* ---------- Profile ---------- */
  .profile-hero{text-align:center; padding:10px 0 22px;}
  .profile-name{font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--ink);}

  /* Weekly-streak style card */
  .streak-card{
    background:var(--forest); border-radius:var(--radius);
    padding:22px; color:#fff; margin-bottom:22px;
  }
  .streak-top{display:flex; gap:14px; align-items:center; margin-bottom:20px;}
  .streak-ring{
    width:60px; height:60px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .streak-ring-inner{
    width:44px; height:44px; border-radius:50%;
    background:var(--forest-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
  }
  .streak-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin-bottom:4px;}
  .streak-sub{font-size:12.5px; color:rgba(255,255,255,0.72); line-height:1.5;}
  .streak-bottom .big{font-family:'Inter',sans-serif; font-weight:800; font-size:32px;}
  .streak-bottom .cap{display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.6); margin-top:2px;}

  .profile-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;
  }
  .profile-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:16px; text-align:center;
  }
  .profile-card .num{font-family:'Inter',sans-serif; font-size:24px; font-weight:800; color:var(--ink);}
  .profile-card .num.accent{color:var(--terracotta);}
  .profile-card .lbl{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px;}

  .section-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim);
    margin:22px 0 10px;
  }

  /* Monthly-goal style progress bar */
  .goal-row{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:8px;}
  .goal-label{color:var(--ink);font-weight:600;}
  .goal-value{font-weight:800; color:var(--ink);}
  .goal-track{height:10px; background:var(--track); border-radius:6px; overflow:hidden;}
  .goal-fill{height:100%; background:var(--forest); border-radius:6px;}

  .cat-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px;}
  .cat-bar-row .cat-name{width:80px; flex-shrink:0; color:var(--ink-dim);}
  .cat-bar-track{flex:1; height:8px; background:var(--track); border-radius:5px; overflow:hidden;}
  .cat-bar-fill{height:100%; background:var(--forest); border-radius:5px;}
  .cat-bar-count{width:20px; text-align:right; color:var(--ink-dim); font-weight:700;}

  /* Milestone-unlocked style rows */
  .milestone-row{display:flex; align-items:center; gap:14px; padding:10px 0;}
  .milestone-badge{
    width:44px; height:44px; border-radius:50%;
    background:var(--terracotta); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
  }
  .milestone-title{font-weight:700; font-size:14px; color:var(--ink);}
  .milestone-sub{font-size:12px; color:var(--ink-dim); margin-top:1px;}

  /* Category tag pills */
  .tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; border-radius:20px; padding:4px 12px;}
  .tag-sun{background:#F5DEB4; color:#8A5A22;}
  .tag-water{background:var(--water-bg); color:var(--water);}
  .tag-terracotta{background:#F0D6C7; color:var(--terracotta);}
  .tag-sage{background:var(--sage); color:var(--sage-deep);}
  .tag-compost{background:#E9DEC5; color:#6B5230;}
  .tag-neutral{background:var(--track); color:var(--ink-dim);}
  .icon-sun{background:#F5DEB4;}
  .icon-water{background:var(--water-bg);}
  .icon-terracotta{background:#F0D6C7;}
  .icon-sage{background:var(--sage);}
  .icon-compost{background:#E9DEC5;}
  .icon-neutral{background:var(--track);}

  /* ---------- Tab bar ---------- */
  #tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--ink-dim); cursor:pointer;
    padding:6px 0; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:700;
    letter-spacing:0.3px; text-transform:uppercase;
  }
  .tab-btn svg{width:20px; height:20px;}
  .tab-btn.active{color:var(--forest);}
  .tab-btn.scan-tab{color:var(--ink-dim);}
  .tab-btn.scan-tab .plus-circle{
    width:46px; height:46px; border-radius:50%;
    background:var(--forest);
    display:flex; align-items:center; justify-content:center;
    margin-top:-22px;
    box-shadow:0 4px 10px rgba(32,54,42,0.3);
  }
  .tab-btn.scan-tab .plus-circle svg{width:22px; height:22px; stroke:#fff;}
  .tab-btn.scan-tab.active{color:var(--forest);}
  .tab-btn.scan-tab.active .plus-circle{background:var(--forest-deep);}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--forest); color:#fff; padding:10px 18px; border-radius:30px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:50; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="wordmark">SORT<span>/</span>ED</div>
    <div class="header-stats">
      <div class="stat-pill"><span class="icon">🔥</span><span id="hdr-streak">0</span></div>
      <div class="stat-pill"><span class="icon">🌿</span><span id="hdr-points">0</span></div>
    </div>
  </header>

  <main>

    <!-- FEED VIEW -->
    <section class="view active" id="view-feed">
      <h1 class="view-title">Community feed</h1>
      <div id="feed-list"></div>
    </section>

    <!-- LEADERBOARD VIEW -->
    <section class="view" id="view-board">
      <h1 class="view-title">Leaderboard</h1>
      <div id="board-content"></div>
    </section>

    <!-- SCAN / POST VIEW -->
    <section class="view" id="view-scan">
      <h1 class="view-title">New post</h1>
      <div id="scan-idle" class="scan-hero">
        <button class="scan-btn" id="scan-trigger">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6"><path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .9-.55l.6-1.2A1 1 0 0 1 9.6 3.6h4.8a1 1 0 0 1 .9.55l.6 1.2a1 1 0 0 0 .9.55H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="12.5" r="3.6"/></svg>
          <span class="label">Scan</span>
        </button>
        <p class="scan-sub">Photograph what you're recycling. We'll identify it, estimate your impact, and get it ready to share with the feed.</p>
      </div>

      <div id="scan-analyzing" class="analyzing" style="display:none;">
        <img id="analyzing-preview" src="" alt="">
        <div class="spinner"></div>
        <div class="msg" id="analyzing-msg">READING MATERIAL...</div>
      </div>

      <div id="scan-reveal" style="display:none;"></div>
    </section>

    <!-- PROFILE VIEW -->
    <section class="view" id="view-profile">
      <h1 class="view-title">Your impact</h1>
      <div id="profile-content"></div>
    </section>

  </main>

  <nav id="tabbar">
    <button class="tab-btn active" data-view="feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg>
      Feed
    </button>
    <button class="tab-btn" data-view="board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M6 4h12v4a6 6 0 0 1-12 0V4z"/><path d="M6 6H4a2 2 0 0 0 0 4h2M18 6h2a2 2 0 0 1 0 4h-2"/></svg>
      Board
    </button>
    <button class="tab-btn scan-tab" data-view="scan">
      <span class="plus-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
      Post
    </button>
    <button class="tab-btn" data-view="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>
      You
    </button>
  </nav>

  <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
  <div id="toast"></div>
</div>

<script>
(function(){
  const STORAGE = window.storage;

  // ---- Backend API config ----
  // After deploying the FastAPI service in /server (see README), replace these two values.
  const API_ENDPOINT = "https://canine-cupbearer-cringing.ngrok-free.dev";
  const APP_SECRET = "REPLACE_WITH_YOUR_OWN_SECRET"; // must match APP_SECRET set on the server

  const IMPACT = {
    plastic:{co2:1.5, label:'Plastic', icon:'♳', tag:'sun'},
    glass:{co2:0.3, label:'Glass', icon:'🍾', tag:'water'},
    metal:{co2:4.0, label:'Metal', icon:'🥫', tag:'terracotta'},
    paper:{co2:0.9, label:'Paper', icon:'📄', tag:'sage'},
    compost:{co2:0.4, label:'Compost', icon:'🍂', tag:'compost'},
    other:{co2:0.5, label:'Other', icon:'♻️', tag:'neutral'}
  };
  const SIZE_G = {small:15, medium:80, large:300};

  let profile = null;
  let pendingPost = null;

  function defaultProfile(){
    return {username:null, totalPoints:0, currentStreak:0, longestStreak:0, lastScanDate:null, totalScans:0, byCategory:{}};
  }

  async function loadProfile(){
    try{
      const r = await STORAGE.get('profile', false);
      profile = r ? JSON.parse(r.value) : defaultProfile();
    }catch(e){ profile = defaultProfile(); }
  }
  async function saveProfile(){
    try{ await STORAGE.set('profile', JSON.stringify(profile), false); }
    catch(e){ console.error('save profile failed', e); }
  }
  async function updateLeaderboardEntry(){
    if(!profile.username) return;
    try{
      await STORAGE.set('board:'+profile.username, JSON.stringify({username:profile.username, points:profile.totalPoints}), true);
    }catch(e){ console.error('leaderboard update failed', e); }
  }
  async function loadLeaderboard(){
    try{
      const listRes = await STORAGE.list('board:', true);
      const keys = (listRes && listRes.keys) || [];
      const entries = [];
      for(const k of keys.slice(0,60)){
        try{
          const r = await STORAGE.get(k, true);
          if(r) entries.push(JSON.parse(r.value));
        }catch(e){}
      }
      entries.sort((a,b)=>b.points-a.points);
      return entries;
    }catch(e){ return []; }
  }
  async function savePost(post){
    try{ await STORAGE.set('post:'+post.id, JSON.stringify(post), true); }
    catch(e){ console.error('save post failed', e); }
  }
  async function loadPosts(){
    try{
      const listRes = await STORAGE.list('post:', true);
      const keys = (listRes && listRes.keys) || [];
      const entries = [];
      for(const k of keys.slice(0,100)){
        try{
          const r = await STORAGE.get(k, true);
          if(r) entries.push(JSON.parse(r.value));
        }catch(e){}
      }
      entries.sort((a,b)=>b.ts-a.ts);
      return entries;
    }catch(e){ return []; }
  }

  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 720; quality = quality || 0.7;
    return new Promise((resolve,reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else{ if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function classifyImage(base64, mediaType){
    const res = await fetch(API_ENDPOINT + '/api/classify', {
      method:"POST",
      headers:{"Content-Type":"application/json", "x-app-secret": APP_SECRET, "ngrok-skip-browser-warning":"true"},
      body: JSON.stringify({image_base64: base64, media_type: mediaType})
    });
    if(!res.ok) throw new Error('classify request failed: '+res.status);
    return res.json();
  }

  function computeImpact(category, sizeBucket){
    const imp = IMPACT[category] || IMPACT.other;
    const weightG = SIZE_G[sizeBucket] || SIZE_G.medium;
    const co2G = Math.round(weightG * imp.co2);
    const points = Math.max(5, Math.round(co2G/3));
    return {weightG, co2G, points, imp, category: IMPACT[category] ? category : 'other'};
  }

  function updateStreak(){
    const today = new Date().toISOString().slice(0,10);
    if(profile.lastScanDate === today) return;
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    profile.currentStreak = (profile.lastScanDate === yesterday) ? profile.currentStreak+1 : 1;
    profile.lastScanDate = today;
    profile.longestStreak = Math.max(profile.longestStreak, profile.currentStreak);
  }

  function applyStreakBonus(points){
    const bonus = 1 + Math.min(profile.currentStreak,10)*0.1;
    return Math.round(points*bonus);
  }

  function timeAgo(ts){
    const diff = Date.now()-ts;
    const min = Math.floor(diff/60000);
    if(min < 1) return 'just now';
    if(min < 60) return min+'m ago';
    const hr = Math.floor(min/60);
    if(hr < 24) return hr+'h ago';
    return Math.floor(hr/24)+'d ago';
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  function renderHeader(){
    document.getElementById('hdr-streak').textContent = profile.currentStreak;
    document.getElementById('hdr-points').textContent = profile.totalPoints;
  }

  // ---------- Scan flow ----------
  const cameraInput = document.getElementById('camera-input');
  document.getElementById('scan-trigger').addEventListener('click', ()=> cameraInput.click());
  cameraInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) handleFile(file);
    cameraInput.value = '';
  });

  const analyzingMsgs = ['READING MATERIAL...','ESTIMATING WEIGHT...','CALCULATING IMPACT...'];
  async function handleFile(file){
    document.getElementById('scan-idle').style.display = 'none';
    document.getElementById('scan-reveal').style.display = 'none';
    document.getElementById('scan-analyzing').style.display = 'flex';

    let msgIdx = 0;
    const msgEl = document.getElementById('analyzing-msg');
    msgEl.textContent = analyzingMsgs[0];
    const msgTimer = setInterval(()=>{
      msgIdx = (msgIdx+1) % analyzingMsgs.length;
      msgEl.textContent = analyzingMsgs[msgIdx];
    }, 1100);

    try{
      const imageDataUrl = await compressImage(file);
      document.getElementById('analyzing-preview').src = imageDataUrl;
      const meta = imageDataUrl.substring(0, imageDataUrl.indexOf(','));
      const base64 = imageDataUrl.substring(imageDataUrl.indexOf(',')+1);
      const mediaType = (meta.match(/data:(.*);base64/) || [,'image/jpeg'])[1];

      const result = await classifyImage(base64, mediaType);
      const {weightG, co2G, points, imp, category} = computeImpact(result.category, result.size_bucket);

      pendingPost = {
        category,
        itemName: result.item_name || imp.label,
        weightG, co2G, points,
        funFact: result.fun_fact || '',
        imageDataUrl
      };

      clearInterval(msgTimer);
      document.getElementById('scan-analyzing').style.display = 'none';
      renderReview(pendingPost);
    }catch(err){
      console.error(err);
      clearInterval(msgTimer);
      document.getElementById('scan-analyzing').style.display = 'none';
      document.getElementById('scan-idle').style.display = 'flex';
      showToast("Couldn't read that scan — try again");
    }
  }

  function renderReview(pending){
    const imp = IMPACT[pending.category];
    const revealEl = document.getElementById('scan-reveal');
    revealEl.innerHTML = `
      <div class="post-preview">
        <div class="post-preview-image"><img src="${pending.imageDataUrl}" alt=""></div>
        <div class="post-preview-body">
          <div class="ticket-cat tag-${imp.tag}">${imp.icon} ${imp.label}</div>
          <div class="ticket-item">${escapeHtml(pending.itemName)}</div>
          <div class="ticket-stats">
            <div class="ticket-stat"><div class="num">${pending.weightG}g</div><div class="lbl">Est. weight</div></div>
            <div class="ticket-stat"><div class="num">${pending.co2G}g</div><div class="lbl">CO2 saved</div></div>
            <div class="ticket-stat"><div class="num accent">+${pending.points}</div><div class="lbl">Points</div></div>
          </div>
          ${pending.funFact ? `<div class="ticket-fact"><b>Did you know:</b> ${escapeHtml(pending.funFact)}</div>` : ''}
        </div>
      </div>
      <div class="reveal-actions">
        <button class="btn" id="retake-btn">Retake</button>
        <button class="btn primary" id="post-btn">Post to feed</button>
      </div>
    `;
    revealEl.style.display = 'block';
    document.getElementById('retake-btn').addEventListener('click', resetScanView);
    document.getElementById('post-btn').addEventListener('click', ()=>{
      if(!profile.username){ promptUsernameThenPost(); return; }
      finalizePost(pendingPost);
    });
  }

  function resetScanView(){
    pendingPost = null;
    document.getElementById('scan-reveal').style.display = 'none';
    document.getElementById('scan-idle').style.display = 'flex';
  }

  function promptUsernameThenPost(){
    const actionsEl = document.querySelector('.reveal-actions');
    actionsEl.innerHTML = `
      <div class="name-setup" style="flex:1;">
        <p>Add your name to post to the community feed.</p>
        <input id="post-username-input" placeholder="Your name" maxlength="24">
        <button class="btn primary" id="post-username-save" style="width:100%">Continue</button>
      </div>
    `;
    document.getElementById('post-username-save').addEventListener('click', async ()=>{
      const val = document.getElementById('post-username-input').value.trim();
      if(!val) return;
      profile.username = val;
      await saveProfile();
      await updateLeaderboardEntry();
      finalizePost(pendingPost);
    });
  }

  async function finalizePost(pending){
    updateStreak();
    const finalPoints = applyStreakBonus(pending.points);
    profile.totalPoints += finalPoints;
    profile.totalScans += 1;
    profile.byCategory[pending.category] = (profile.byCategory[pending.category]||0)+1;
    await saveProfile();
    await updateLeaderboardEntry();

    const post = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      ts: Date.now(),
      username: profile.username,
      category: pending.category,
      itemName: pending.itemName,
      weightG: pending.weightG,
      co2G: pending.co2G,
      points: finalPoints,
      funFact: pending.funFact,
      imageDataUrl: pending.imageDataUrl
    };
    await savePost(post);

    renderHeader();
    resetScanView();
    showToast('Posted to the feed!');
    document.querySelector('.tab-btn[data-view="feed"]').click();
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Feed ----------
  async function renderFeed(){
    const el = document.getElementById('feed-list');
    el.innerHTML = `<div class="empty-state"><div class="spinner" style="margin:0 auto;"></div></div>`;
    const posts = await loadPosts();
    if(posts.length === 0){
      el.innerHTML = `<div class="empty-state"><div class="big">📸</div><p>No posts yet.<br>Be the first to share what you're recycling.</p><button class="btn primary" id="feed-empty-scan-btn">Take a photo</button></div>`;
      document.getElementById('feed-empty-scan-btn').addEventListener('click', ()=>{
        document.querySelector('.tab-btn[data-view="scan"]').click();
      });
      return;
    }
    el.innerHTML = posts.map(p=>{
      const imp = IMPACT[p.category] || IMPACT.other;
      const initial = (p.username||'?').trim().charAt(0).toUpperCase();
      return `<div class="post-card">
        <div class="post-header">
          <div class="post-avatar">${initial}</div>
          <div class="post-who">
            <div class="post-name">${escapeHtml(p.username||'Someone')}</div>
            <div class="post-time">${timeAgo(p.ts)}</div>
          </div>
          <div class="tag tag-${imp.tag}">${imp.icon} ${imp.label}</div>
        </div>
        ${p.imageDataUrl ? `<div class="post-image"><img src="${p.imageDataUrl}" alt=""></div>` : ''}
        <div class="post-body">
          <div class="post-item">${escapeHtml(p.itemName)}</div>
          ${p.funFact ? `<div class="post-fact">${escapeHtml(p.funFact)}</div>` : ''}
          <div class="post-stats">
            <div class="post-stat"><span class="num">${p.weightG}g</span><span class="lbl">Weight</span></div>
            <div class="post-stat"><span class="num">${p.co2G}g</span><span class="lbl">CO2 saved</span></div>
            <div class="post-stat"><span class="num accent">+${p.points}</span><span class="lbl">Points</span></div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // ---------- Leaderboard ----------
  async function renderBoard(){
    const el = document.getElementById('board-content');
    if(!profile.username){
      el.innerHTML = `<div class="name-setup">
        <p>Pick a name to join the leaderboard. Everyone using this app link will see it.</p>
        <input id="username-input" placeholder="Your name" maxlength="24">
        <button class="btn primary" id="username-save" style="width:100%">Join leaderboard</button>
      </div>`;
      document.getElementById('username-save').addEventListener('click', async ()=>{
        const val = document.getElementById('username-input').value.trim();
        if(!val) return;
        profile.username = val;
        await saveProfile();
        await updateLeaderboardEntry();
        renderBoard();
        renderProfile();
      });
      return;
    }
    el.innerHTML = `<div class="empty-state"><div class="spinner" style="margin:0 auto;"></div></div>`;
    const entries = await loadLeaderboard();
    if(entries.length === 0){
      el.innerHTML = `<div class="empty-state"><div class="big">🏆</div><p>You're the first one here.<br>Scan something to take the top spot.</p></div>`;
      return;
    }
    el.innerHTML = entries.map((e,i)=>`
      <div class="lb-row ${e.username===profile.username?'me':''}">
        <div class="lb-rank">${i+1}</div>
        <div class="lb-name">${escapeHtml(e.username)}${e.username===profile.username?' (you)':''}</div>
        <div class="lb-pts">${e.points}</div>
      </div>
    `).join('');
  }

  // ---------- Profile ----------
  function computeBadges(){
    const b = [];
    if(profile.totalScans>=1) b.push({icon:'🏷️', label:'First sort', sub:"You've logged your very first item."});
    if(profile.totalScans>=10) b.push({icon:'📦', label:'10 scans', sub:'Ten items diverted from landfill.'});
    if(profile.totalScans>=50) b.push({icon:'🏭', label:'50 scans', sub:'Fifty items and counting — serious impact.'});
    if(profile.longestStreak>=3) b.push({icon:'🔥', label:'3-day streak', sub:'Three days in a row. Keep the chain going.'});
    if(profile.longestStreak>=7) b.push({icon:'🔥', label:'Week streak', sub:'A full week of consistent sorting.'});
    if(profile.longestStreak>=30) b.push({icon:'🔥', label:'30-day streak', sub:'Top-tier consistency. A month strong.'});
    if(profile.totalPoints>=100) b.push({icon:'⭐', label:'100 pts', sub:'Triple digits on the scoreboard.'});
    if(profile.totalPoints>=500) b.push({icon:'🌟', label:'500 pts', sub:'Halfway to a thousand points.'});
    if(profile.totalPoints>=1000) b.push({icon:'💫', label:'1000 pts', sub:'Four figures of environmental impact.'});
    return b;
  }

  function nextMilestone(points){
    const steps = [100,500,1000,2000,5000,10000];
    const found = steps.find(m=>m>points);
    return found || (Math.ceil((points+500)/500)*500);
  }

  function renderProfile(){
    const el = document.getElementById('profile-content');
    const badges = computeBadges();
    const cats = Object.entries(profile.byCategory).sort((a,b)=>b[1]-a[1]);
    const maxCat = cats.length ? cats[0][1] : 1;
    const ringPct = Math.round((Math.min(profile.currentStreak,7)/7)*100);
    const nextGoal = nextMilestone(profile.totalPoints);
    const goalPct = Math.min(100, Math.round((profile.totalPoints/nextGoal)*100));

    el.innerHTML = `
      <div class="profile-hero">
        <div class="profile-name">${profile.username ? escapeHtml(profile.username) : 'Set a name in Board'}</div>
      </div>

      <div class="streak-card">
        <div class="streak-top">
          <div class="streak-ring" style="background:conic-gradient(var(--sun) 0% ${ringPct}%, rgba(255,255,255,0.2) ${ringPct}% 100%)">
            <div class="streak-ring-inner">🔥</div>
          </div>
          <div class="streak-copy">
            <div class="streak-title">${profile.currentStreak>0 ? 'Growing steady' : 'Ready to start'}</div>
            <div class="streak-sub">${profile.currentStreak>0 ? `You're on a ${profile.currentStreak}-day streak. Longest run so far: ${profile.longestStreak} days.` : 'Scan an item today to start your streak.'}</div>
          </div>
        </div>
        <div class="streak-bottom">
          <span class="big">${profile.currentStreak}</span>
          <span class="cap">Day streak</span>
        </div>
      </div>

      <div class="profile-grid">
        <div class="profile-card"><div class="num">${profile.totalPoints}</div><div class="lbl">Total points</div></div>
        <div class="profile-card"><div class="num accent">${profile.totalScans}</div><div class="lbl">Items sorted</div></div>
        <div class="profile-card"><div class="num">${profile.currentStreak}</div><div class="lbl">Current streak</div></div>
        <div class="profile-card"><div class="num accent">${profile.longestStreak}</div><div class="lbl">Longest streak</div></div>
      </div>

      <div class="section-label">Next milestone</div>
      <div class="goal-row">
        <div class="goal-label">Points to next milestone</div>
        <div class="goal-value">${profile.totalPoints} / ${nextGoal}</div>
      </div>
      <div class="goal-track"><div class="goal-fill" style="width:${goalPct}%"></div></div>

      <div class="section-label">By material</div>
      ${cats.length ? cats.map(([cat,count])=>{
        const imp = IMPACT[cat];
        const pct = Math.round((count/maxCat)*100);
        return `<div class="cat-bar-row">
          <div class="cat-name">${imp.icon} ${imp.label}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
          <div class="cat-bar-count">${count}</div>
        </div>`;
      }).join('') : `<p style="color:var(--ink-dim); font-size:13px;">Nothing sorted yet.</p>`}

      <div class="section-label">Milestones</div>
      ${badges.length ? badges.map(b=>`
        <div class="milestone-row">
          <div class="milestone-badge">${b.icon}</div>
          <div class="milestone-copy">
            <div class="milestone-title">${b.label}</div>
            <div class="milestone-sub">${b.sub}</div>
          </div>
        </div>
      `).join('') : `<p style="color:var(--ink-dim); font-size:13px;">Scan items to unlock milestones.</p>`}
    `;
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-'+btn.dataset.view).classList.add('active');
      if(btn.dataset.view === 'feed') renderFeed();
      if(btn.dataset.view === 'board') renderBoard();
      if(btn.dataset.view === 'profile') renderProfile();
    });
  });

  // ---------- Init ----------
  (async function init(){
    await loadProfile();
    renderHeader();
    renderFeed();
  })();

})();
</script>
</body>
</html>
